<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAHIDA · Restaurante</title>
<meta name="description" content="Restaurante SAHIDA — reserve a sua mesa online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e9; --surface:#fffdf8; --ink:#2a2622; --muted:#6f655b;
    --accent:#4a3324; --accent-ink:#ffffff; --clay:#a5623f; --line:#e3d9ca;
    --ok:#3f6b46; --err:#9b3b2f;
    --radius:14px; --max:1120px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
  img{max-width:100%;display:block}
  a{color:inherit}
  h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.1;margin:0 0 .5em}
  h2{font-size:clamp(2rem,4vw,2.8rem)}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 16px}
  section{padding:72px 0;scroll-margin-top:64px}
  .eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:.75rem;color:var(--clay);font-weight:600;margin-bottom:.6em}

  /* Header */
  header{position:fixed;inset:0 0 auto 0;z-index:20;transition:background .3s,box-shadow .3s}
  header.solid{background:rgba(246,241,233,.96);box-shadow:0 1px 0 var(--line);backdrop-filter:blur(6px)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{font-family:Barlow,"DIN Alternate",sans-serif;font-size:1.45rem;letter-spacing:.14em;font-weight:500;text-decoration:none;color:#fff}
  header.solid .logo{color:var(--ink)}
  .links{display:flex;gap:22px;align-items:center}
  .links a{text-decoration:none;font-size:.92rem;color:#fff}
  header.solid .links a{color:var(--ink)}
  .lang{display:flex;gap:4px}
  .lang button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:3px 9px;font:600 .72rem Inter,sans-serif;cursor:pointer}
  header.solid .lang button{border-color:var(--line);color:var(--ink)}
  .lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}
  header.solid .lang button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .menu-links{display:flex;gap:22px}
  @media (max-width:760px){.menu-links{display:none}}

  /* Hero */
  .hero{min-height:92vh;display:flex;align-items:flex-end;color:#fff;position:relative;
    background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.55)),url(img/carrossel-1.jpg) center 55%/cover,linear-gradient(135deg,#4d5a35,#a5623f)}
  .hero .wrap{padding-bottom:80px;width:100%}
  .hero h1{font-family:Barlow,"DIN Alternate",sans-serif;font-weight:500;font-size:clamp(3.4rem,11vw,7rem);letter-spacing:.1em;margin:0;line-height:1}
  .hero p{font-size:1.15rem;max-width:520px;opacity:.95}
  .btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 28px;font:600 .95rem Inter,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s,opacity .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn.light{background:#fff;color:var(--ink)}
  .btn[disabled]{opacity:.6;cursor:wait}

  /* About */
  .about{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
  .about .ph{aspect-ratio:4/5;border-radius:var(--radius)}
  @media (max-width:760px){.about{grid-template-columns:1fr;gap:28px}}

  /* Fotos */
  .ph{border-radius:var(--radius);overflow:hidden;background:#c9b79c}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  /* Gallery */
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:220px;grid-auto-flow:dense;gap:12px;margin-top:40px}
  .gallery .ph{border-radius:10px}
  .gallery .tall{grid-row:span 2}
  .gallery .wide{grid-column:span 2}
  @media (max-width:760px){.gallery{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px}}

  /* Avaliações */
  .reviews{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:40px;align-items:start}
  @media (max-width:860px){.reviews{grid-template-columns:1fr;gap:24px}}
  .score{display:flex;flex-direction:column;gap:6px}
  .score-num{font-family:Barlow,"DIN Alternate",sans-serif;font-size:4.5rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
  .stars{position:relative;display:inline-block;font-size:1.4rem;letter-spacing:3px;line-height:1;color:var(--line)}
  .stars span{position:absolute;inset:0 auto 0 0;overflow:hidden;white-space:nowrap;color:#c8902e}
  .score small{color:var(--muted)}
  .quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  @media (max-width:860px){.quotes{grid-template-columns:1fr}}
  .quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:0;display:flex;flex-direction:column;gap:12px}
  .quote blockquote{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.25rem;line-height:1.35}
  .quote figcaption{font-size:.8rem;color:var(--muted)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);padding:10px 20px;margin-top:10px;align-self:flex-start}

  /* Menu */
  .menu{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:28px}
  @media (max-width:860px){.menu-grid{grid-template-columns:1fr}}
  .menu-cat h3{font-size:1.6rem;border-bottom:1px solid var(--line);padding-bottom:.4em}
  .dish{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .dish small{display:block;color:var(--muted)}
  .price{white-space:nowrap;font-weight:600}
  .note{color:var(--muted);font-size:.9rem;margin-top:24px}

  /* Reservation */
  .reserve{display:grid;grid-template-columns:1fr 1.3fr;gap:48px}
  @media (max-width:860px){.reserve{grid-template-columns:1fr;gap:24px}}
  form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:560px){form{grid-template-columns:1fr;padding:20px}}
  .full{grid-column:1/-1}
  label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px}
  input,select,textarea{width:100%;font:16px Inter,sans-serif;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  textarea{min-height:90px;resize:vertical}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:var(--muted)}
  .check input{width:auto;margin-top:4px}
  .hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
  .msg{grid-column:1/-1;border-radius:10px;padding:16px;display:none}
  .msg.ok{display:block;background:#e7efe3;color:var(--ok)}
  .msg.err{display:block;background:#f6e3df;color:var(--err)}
  /* Calendar + time slots */
  .cal{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
  .cal-nav{border:1px solid var(--line);background:#fff;border-radius:999px;width:34px;height:34px;font-size:1.1rem;cursor:pointer;color:var(--ink)}
  .cal-nav:disabled{opacity:.3;cursor:default}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
  .cal-dow{font-size:.7rem;color:var(--muted);font-weight:600;padding:4px 0;text-transform:uppercase}
  .cal-day{aspect-ratio:1;min-height:34px;border:0;border-radius:8px;background:transparent;font:500 .92rem Inter,sans-serif;cursor:pointer;color:var(--ink);padding:0}
  .cal-day:hover:not(:disabled){background:var(--bg)}
  .cal-day:disabled{color:#cdc3b6;cursor:default}
  .cal-day.closed:disabled{text-decoration:line-through}
  .cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .cal-day.sel{background:var(--accent);color:#fff}
  .picked{margin:0 0 10px;font-weight:600;min-height:1.6em}
  .slots{display:flex;flex-wrap:wrap;gap:8px}
  .slot-label{width:100%;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--clay);font-weight:600;margin-top:6px}
  .slot{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:500 .9rem Inter,sans-serif;cursor:pointer;color:var(--ink)}
  .slot:hover:not(:disabled){border-color:var(--accent)}
  .slot:disabled{opacity:.35;cursor:default}
  .slot.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .slots-empty{color:var(--muted);font-size:.9rem}
  .info-list{list-style:none;padding:0;margin:20px 0 0}
  .info-list li{padding:10px 0;border-bottom:1px solid var(--line)}
  .info-list strong{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--clay)}

  /* Contact */
  .contact{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  @media (max-width:760px){.contact{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
  .hours{width:100%;border-collapse:collapse;font-size:.95rem}
  .hours td{padding:4px 0}
  .hours td:last-child{text-align:right;color:var(--muted)}

  footer{background:var(--ink);color:#d8cfc3;padding:32px 0;font-size:.85rem}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer a{color:#fff}
  footer .wrap{align-items:center}
  footer .ev{display:inline-block;vertical-align:middle;margin-left:8px;opacity:.9;transition:opacity .2s}
  footer .ev:hover{opacity:1}
  footer .ev img{height:46px;width:auto}
</style>
</head>
<body>

<header id="top">
  <div class="wrap nav">

      <div class="lang" role="group" aria-label="Idioma">

        <button type="button" data-lang="en">EN</button>

    </div>

</header>

<section class="hero">

      <div class="ph "><img src="img/carrossel-4.jpg" alt="Sala abobadada" loading="lazy"></div>
      <div class="ph wide"><img src="img/interior-3.jpg" alt="Mesa posta" loading="lazy"></div>

<section id="reservas">

        <label id="lbl-date" data-i18n="f_date"></label>

      </div>

        <label for="f-people" data-i18n="f_people"></label>
        <select id="f-people" name="people" required></select>
      </div>
      <div class="full">
        <label for="f-notes" data-i18n="f_notes"></label>
        <textarea id="f-notes" name="notes" maxlength="500"></textarea>

      </div>

    </form>
  </div>
</section>

</section>

/* ============================================================
   LÓGICA
   ============================================================ */
let lang = "pt";
const $ = id => document.getElementById(id);
const t = (k, n) => (T[lang][k] || "").replace("{n}", n);

function pickLang(){
  let saved = null;
  try { saved = localStorage.getItem("sahida_lang"); } catch(e){}
  if (saved && T[saved]) return saved;
  const nav = (navigator.language || "pt").slice(0,2).toLowerCase();
  return T[nav] ? nav : "pt";
}

function slots(from, to){
  const out = []; let [h,m] = from.split(":").map(Number); const [eh,em] = to.split(":").map(Number);
  while (h*60+m <= eh*60+em){ out.push(String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")); m+=30; if(m>=60){h++;m-=60;} }
  return out;
}

/* ---------- Calendário ---------- */
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const cal = { view:null, date:"", time:"" };
const todayIso = () => isoLocal(new Date());
const maxIso = () => { const d=new Date(); d.setDate(d.getDate()+SITE.maxDaysAhead); return isoLocal(d); };
const isClosed = iso => SITE.closedWeekdays.includes(new Date(iso+"T12:00:00").getDay());

function buildCalendar(){
  if (!cal.view){ const n=new Date(); cal.view=new Date(n.getFullYear(), n.getMonth(), 1); }
  const y=cal.view.getFullYear(), m=cal.view.getMonth();
  const monthName = cap(cal.view.toLocaleDateString(lang, {month:"long", year:"numeric"}));
  const dows = [...Array(7)].map((_,i)=>new Date(2024,0,1+i).toLocaleDateString(lang,{weekday:"short"}).replace(".",""));
  const lead = (new Date(y,m,1).getDay()+6)%7;           // semana começa à segunda
  const days = new Date(y,m+1,0).getDate();
  const tIso=todayIso(), mIso=maxIso();
  const n=new Date(), first=new Date(n.getFullYear(), n.getMonth(), 1);
  const lastView=new Date(new Date(mIso+"T12:00:00").getFullYear(), new Date(mIso+"T12:00:00").getMonth(), 1);
  let h = `<div class="cal-head">
      <button type="button" class="cal-nav" data-nav="-1" aria-label="${t("f_prev")}" ${cal.view<=first?"disabled":""}>‹</button>
      <span>${monthName}</span>
      <button type="button" class="cal-nav" data-nav="1" aria-label="${t("f_next")}" ${cal.view>=lastView?"disabled":""}>›</button>
    </div><div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join("")}`;
  for (let i=0;i<lead;i++) h += `<span></span>`;
  for (let d=1; d<=days; d++){
    const iso = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const closed = isClosed(iso), off = iso<tIso || iso>mIso || closed;
    const cls = ["cal-day", iso===tIso?"today":"", iso===cal.date?"sel":"", closed?"closed":""].join(" ");
    h += `<button type="button" class="${cls}" data-date="${iso}" ${off?"disabled":""} aria-pressed="${iso===cal.date}">${d}</button>`;
  }
  $("cal").innerHTML = h + `</div>`;
}

function buildSlots(){
  const box = $("slots");
  $("pickedDate").textContent = cal.date ? cap(new Date(cal.date+"T12:00:00").toLocaleDateString(lang,{weekday:"long", day:"numeric", month:"long"})) : "";
  if (!cal.date){ box.innerHTML = `<p class="slots-empty">${t("f_pick_date")}</p>`; return; }
  const now = new Date(), isToday = cal.date===todayIso();
  const minMin = now.getHours()*60 + now.getMinutes() + 60;   // hoje: só a partir de daqui a 1h
  let h = "";
  [["f_lunch",SITE.lunch],["f_dinner",SITE.dinner]].forEach(([k,r])=>{
    h += `<span class="slot-label">${t(k)}</span>`;
    slots(r.from,r.to).forEach(s=>{
      const [hh,mm]=s.split(":").map(Number), past = isToday && hh*60+mm < minMin;
      h += `<button type="button" class="slot ${s===cal.time?"sel":""}" data-time="${s}" ${past?"disabled":""} aria-pressed="${s===cal.time}">${s}</button>`;
    });
  });
  box.innerHTML = h;
}

function buildTime(){ buildCalendar(); buildSlots(); }

function resetPicker(){ cal.date=""; cal.time=""; $("f-date").value=""; $("f-time").value=""; buildTime(); }

function buildPeople(){
  const sel = $("f-people"), cur = sel.value;
  sel.innerHTML = `<option value="">${t("f_choose")}</option>`;
  for (let i=1;i<=SITE.maxPeople;i++){ const o=document.createElement("option"); o.value=i; o.textContent=`${i} ${i===1?t("f_person"):t("f_persons")}`; sel.appendChild(o); }
  const o=document.createElement("option"); o.value="more"; o.textContent=t("f_more",SITE.maxPeople); sel.appendChild(o);
  sel.value = cur;
}

function buildMenu(){
  $("menuGrid").innerHTML = MENU.map(c=>`
    <div class="menu-cat"><h3>${c.cat[lang]}</h3>
      ${c.items.map(d=>`<div class="dish"><div>${d.name[lang]}<small>${d.desc[lang]||""}</small></div><span class="price">${d.price}</span></div>`).join("")}
    </div>`).join("");
}

function buildReviews(){
  $("ratingNum").textContent = REVIEWS.rating.toLocaleString(lang,{minimumFractionDigits:1});
  $("ratingStars").querySelector("span").style.width = (REVIEWS.rating/5*100)+"%";
  $("ratingCount").textContent = t("rev_count", REVIEWS.count);
  $("reviewsLink").href = REVIEWS.url;
  $("quotes").innerHTML = REVIEWS.quotes.map(q=>`<figure class="quote"><blockquote lang="en">“${q}”</blockquote><figcaption>${t("rev_src")}</figcaption></figure>`).join("");
}

function buildContacts(){
  const tel = "tel:" + SITE.phone.replace(/\s/g,"");
  ["phoneLink","phoneLink2"].forEach(id=>{ $(id).href=tel; $(id).textContent=SITE.phone; });
  const em = $("emailLink");
  if (em && SITE.email){ em.href = "mailto:"+SITE.email; em.textContent = SITE.email; }
  else if (em){ em.previousElementSibling?.remove(); em.remove(); }
  $("igLink").href = SITE.instagram; $("address").innerText = SITE.address; $("mapsLink").href = SITE.mapsUrl;
  $("hoursTable").innerHTML = SITE.hours.map(h=>`<tr><td>${h.days[lang]}</td><td>${typeof h.time==="string"?h.time:h.time[lang]}</td></tr>`).join("");
}

function setLang(l){
  lang = l; document.documentElement.lang = l;
  try { localStorage.setItem("sahida_lang", l); } catch(e){}
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===l));
  buildTime(); buildPeople(); buildMenu(); buildReviews(); buildContacts();
  const m = $("formMsg"); if (m.className.includes("err")) { m.className="msg"; }
}

function isoLocal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function showMsg(type, text){ const m=$("formMsg"); m.className="msg "+type; m.textContent=text; }

async function onSubmit(ev){
  ev.preventDefault();
  const f = ev.target, data = Object.fromEntries(new FormData(f));
  if (data.website) return; // spam
  if (!data.name.trim() || !data.email || !data.phone.trim() || !data.date || !data.time || !data.people) return showMsg("err", t("err_fields"));
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) return showMsg("err", t("err_email"));
  if (data.people === "more") return showMsg("err", t("err_big", SITE.maxPeople));
  const day = new Date(data.date+"T12:00:00");
  if (data.date < isoLocal(new Date())) return showMsg("err", t("err_past"));
  if (SITE.closedWeekdays.includes(day.getDay())) return showMsg("err", t("err_closed"));
  if (!$("f-consent").checked) return showMsg("err", t("err_consent"));

  const btn = $("submitBtn"); btn.disabled = true; btn.textContent = t("sending");
  try {
    if (SITE.scriptUrl) {
      const body = new URLSearchParams({ ...data, lang });
      await fetch(SITE.scriptUrl, { method:"POST", mode:"no-cors", body });
      showMsg("ok", t("ok"));
    } else {
      await new Promise(r=>setTimeout(r,600));
      showMsg("ok", t("ok") + t("demo"));
    }
    f.reset(); resetPicker(); buildPeople();
  } catch(e) {
    showMsg("err", t("err_send"));
  } finally {
    btn.disabled = false; btn.textContent = t("f_submit");
  }
}

(function init(){
  const today = new Date(), max = new Date(); max.setDate(max.getDate()+SITE.maxDaysAhead);
  $("cal").addEventListener("click", e=>{
    const nav = e.target.closest("[data-nav]"), day = e.target.closest("[data-date]");
    if (nav && !nav.disabled){ cal.view = new Date(cal.view.getFullYear(), cal.view.getMonth()+Number(nav.dataset.nav), 1); buildCalendar(); }
    if (day && !day.disabled){ cal.date = day.dataset.date; $("f-date").value = cal.date; cal.time=""; $("f-time").value=""; buildTime(); }
  });
  $("slots").addEventListener("click", e=>{
    const b = e.target.closest("[data-time]"); if (!b || b.disabled) return;
    cal.time = b.dataset.time; $("f-time").value = cal.time; buildSlots();
  });
  $("year").textContent = today.getFullYear();
  document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
  $("bookingForm").addEventListener("submit", onSubmit);
  const hdr = $("top"); const onScroll = ()=>hdr.classList.toggle("solid", window.scrollY > 40);
  window.addEventListener("scroll", onScroll, {passive:true}); onScroll();
  setLang(pickLang());
})();
</script>
